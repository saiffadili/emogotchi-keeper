name: Keep Emogotchi Alive

on:
  schedule:
    # Run away from the top of the hour, when scheduled runners are busiest.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check everything without sending MON"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: emogotchi-keeper
  cancel-in-progress: false

jobs:
  check-and-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EMOGOTCHI_PRIVATE_KEY: ${{ secrets.EMOGOTCHI_PRIVATE_KEY }}
      RPC_URL: https://rpc1.monad.xyz
      CAT_ID: "69869"
      FEED_THRESHOLD_HOURS: "4"
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true && 'true' || 'false' }}
    steps:
      - name: Check out keeper
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check cat and feed only if needed
        run: npm run check
