name: Keep Emogotchi Alive

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/keep-alive.yml"
      - "src/**"
      - "package.json"
      - "package-lock.json"
  schedule:
    # Two checks per hour reduce exposure to delayed or dropped schedule events.
    # The 18:17 UTC run sends the daily status.
    - cron: "17,47 0-17,19-23 * * *"
    - cron: "17 18 * * *"
    - cron: "47 18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check everything without sending MON"
        required: true
        default: true
        type: boolean
      force_feed:
        description: "TEST ONLY: spend 1 MON and feed now"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  statuses: write

concurrency:
  group: emogotchi-keeper
  cancel-in-progress: false

jobs:
  check-and-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out keeper
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check cat, feed if needed, and send alerts
        id: keeper
        env:
          EMOGOTCHI_PRIVATE_KEY: ${{ secrets.EMOGOTCHI_PRIVATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RPC_URL: https://rpc1.monad.xyz
          CAT_ID: "25287"
          # Feed halfway through each 48-hour survival window. This leaves a
          # full day of recovery time if GitHub delays or drops scheduled runs.
          FEED_THRESHOLD_HOURS: "24"
          WARNING_THRESHOLD_HOURS: "26"
          DRY_RUN: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == true)) && 'true' || 'false' }}
          FORCE_FEED: ${{ github.event_name == 'workflow_dispatch' && inputs.force_feed == true && 'true' || 'false' }}
          DAILY_STATUS: ${{ github.event_name == 'schedule' && github.event.schedule == '17 18 * * *' && 'true' || 'false' }}
        run: npm run check

      - name: Publish dry-run result on the commit
        if: ${{ always() && github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          KEEPER_OUTCOME: ${{ steps.keeper.outcome }}
          KEEPER_STATE: ${{ steps.keeper.outputs.verification_state }}
          KEEPER_SUMMARY: ${{ steps.keeper.outputs.summary }}
        run: |
          if [ "$KEEPER_OUTCOME" != "success" ]; then
            STATE="failure"
            DESCRIPTION="Keeper dry run failed; check Actions and Telegram"
          elif [ "$KEEPER_STATE" = "success" ]; then
            STATE="success"
            DESCRIPTION="${KEEPER_SUMMARY:-Keeper dry run passed; 0 MON spent}"
          else
            STATE="failure"
            DESCRIPTION="${KEEPER_SUMMARY:-Keeper could not verify the configured cat}"
          fi

          jq -n \
            --arg state "$STATE" \
            --arg description "$DESCRIPTION" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state: $state, description: $description, context: "emogotchi-keeper/dry-run", target_url: $target_url}' \
          | curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data-binary @- \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"

      - name: Alert Telegram if workflow setup failed
        if: ${{ failure() && steps.keeper.outcome != 'failure' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            exit 0
          fi
          curl --fail --silent --show-error \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🚨 Emogotchi keeper could not start. Check the GitHub logs: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
