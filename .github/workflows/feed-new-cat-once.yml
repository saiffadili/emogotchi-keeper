name: Feed New Emogotchi Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/feed-new-cat-once.yml"

permissions:
  contents: read
  statuses: write

concurrency:
  group: emogotchi-keeper
  cancel-in-progress: false

jobs:
  feed-once:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out keeper
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Feed only because the cat is inside the normal safety window
        id: keeper
        env:
          EMOGOTCHI_PRIVATE_KEY: ${{ secrets.EMOGOTCHI_PRIVATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RPC_URL: https://rpc1.monad.xyz
          CAT_ID: "25287"
          FEED_THRESHOLD_HOURS: "8"
          WARNING_THRESHOLD_HOURS: "12"
          DRY_RUN: "false"
          FORCE_FEED: "false"
          DAILY_STATUS: "false"
        run: |
          npm ci
          npm run check

      - name: Publish one-time feed result
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          KEEPER_OUTCOME: ${{ steps.keeper.outcome }}
        run: |
          if [ "$KEEPER_OUTCOME" = "success" ]; then
            STATE="success"
            DESCRIPTION="One-time keeper run completed"
          else
            STATE="failure"
            DESCRIPTION="One-time keeper run failed; check Actions and Telegram"
          fi

          jq -n \
            --arg state "$STATE" \
            --arg description "$DESCRIPTION" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state: $state, description: $description, context: "emogotchi-keeper/feed-once", target_url: $target_url}' \
          | curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data-binary @- \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
